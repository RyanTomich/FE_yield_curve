[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vasicek-model"
version = "0.1.0"
description = "Observe yield curves, calibrate Vasicek, and explore pricing scenarios"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools]
py-modules = ["market", "calibration", "applications", "data", "vasicek", "plots", "main"]
